<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OPIc Display</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6vh 6vw;
      text-align: center;
      overflow: hidden;
    }
    #title { font-size: 3.5vmin; color: #8f8ff8; font-weight: 600; margin: 0 0 3vh; min-height: 1.4em; }
    #text { font-size: 11vmin; line-height: 1.25; font-weight: 800; margin: 0; word-break: normal; }
    #status { position: fixed; bottom: 2vh; right: 3vw; font-size: 2.5vmin; color: #555; }
    #wake { position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
      background: #000; font-size: 5vmin; color: #8f8ff8; cursor: pointer; }
    #wake[hidden] { display: none; }
    #flip { position: fixed; z-index: 2; top: 2vh; right: 3vw; width: 6vmin; height: 6vmin; min-width: 36px; min-height: 36px;
      border-radius: 50%; border: 1px solid #444; background: transparent; color: #888; font-size: 3.5vmin; cursor: pointer; }
    /* 마주 보는 사람 기준 180° 뒤집기: ↻ 버튼 또는 ?flip=1 */
    html.flip body { transform: rotate(180deg); }
  </style>
</head>
<body>
  <p id="title"></p>
  <p id="text">연결 중...</p>
  <div id="status"></div>
  <button id="flip" aria-label="화면 뒤집기">↻</button>
  <div id="wake">터치해서 시작 (화면 꺼짐 방지)</div>

  <script>
    const titleEl = document.getElementById("title");
    const textEl = document.getElementById("text");
    const statusEl = document.getElementById("status");
    const wakeEl = document.getElementById("wake");

    function show(current) {
      titleEl.textContent = current.title || "";
      textEl.textContent = current.text || "";
      // 긴 문구는 글자를 줄여서 한 화면에 들어가게
      const len = (current.text || "").length;
      textEl.style.fontSize = len > 60 ? "6vmin" : len > 30 ? "8vmin" : "11vmin";
    }

    function connect() {
      const es = new EventSource("/api/current/stream");
      es.onopen = () => { statusEl.textContent = "● 연결됨"; };
      es.onmessage = (e) => show(JSON.parse(e.data));
      es.onerror = () => { statusEl.textContent = "○ 재연결 중"; }; // EventSource가 자동 재연결
    }
    connect();

    // 화면이 꺼지지 않게 (지원 브라우저에서만)
    wakeEl.addEventListener("click", async () => {
      wakeEl.hidden = true;
      try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch {}
    });

    // 뒤집기: ↻ 버튼 또는 ?flip=1 (설정은 기억됨)
    const root = document.documentElement;
    function setFlip(on) {
      root.classList.toggle("flip", on);
      try { localStorage.setItem("flip", on ? "1" : "0"); } catch {}
    }
    const flipParam = new URLSearchParams(location.search).get("flip");
    if (flipParam !== null) setFlip(flipParam !== "0");
    else { try { if (localStorage.getItem("flip") === "1") setFlip(true); } catch {} }
    document.getElementById("flip").addEventListener("click", (e) => {
      e.stopPropagation();
      setFlip(!root.classList.contains("flip"));
    });
  </script>
</body>
</html>
