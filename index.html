<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>오픽(OPIc) 원버튼 답변 트레이너</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA 설치(홈 화면 추가) + 웹 푸시(-> 아이폰 알림 -> 애플워치 미러링) 지원 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OPIc 트레이너" />
</head>
<body>
  <!-- 주제 선택 화면 -->
  <div id="screen-topics" class="screen">
    <header class="topics-header">
      <h1>오픽(OPIc) 원버튼 답변 트레이너</h1>
      <p class="subtitle">주제를 고르면, 화면 터치만으로 질문 듣기 → 답변 생성 → 한 문장씩 따라 말하기가 진행됩니다.</p>
    </header>

    <div class="watch-notify-row">
      <button id="watch-notify-btn" class="secondary-btn">🔔 워치 알림 켜기</button>
      <span id="watch-notify-status" class="watch-notify-status"></span>
    </div>

    <details class="personalize">
      <summary>개인화 정보 (선택사항)</summary>
      <div class="control-row">
        <div class="field">
          <label for="name-input">이름</label>
          <input id="name-input" type="text" placeholder="예: Alex" />
        </div>
        <div class="field">
          <label for="job-input">직업 / 신분</label>
          <input id="job-input" type="text" placeholder="예: a college student" />
        </div>
        <div class="field">
          <label for="city-input">거주 도시</label>
          <input id="city-input" type="text" placeholder="예: Seoul" />
        </div>
      </div>
    </details>

    <div id="topic-grid" class="topic-grid"></div>
  </div>

  <!-- 원버튼 연습 화면 -->
  <div id="screen-practice" class="screen practice-screen" hidden>
    <button id="back-btn" class="back-btn" aria-label="주제 선택으로 돌아가기">← 주제 선택</button>

    <div class="progress-bar">
      <span id="progress-text"></span>
    </div>

    <div id="tap-area" class="tap-area" role="button" tabindex="0">
      <p id="hint-text" class="hint-text">화면을 터치하세요</p>
      <p id="main-text" class="main-text"></p>
      <div id="sentence-list" class="sentence-list"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
