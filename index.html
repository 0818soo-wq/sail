<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OPIc Trainer</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA 설치(홈 화면 추가) + 웹 푸시(-> 아이폰 알림 -> 애플워치 미러링) 지원 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OPIc" />
</head>
<body>
  <!-- 홈 화면: START 버튼 하나 -->
  <div id="screen-home" class="screen home-screen">
    <h1 class="home-title">OPIc</h1>
    <button id="start-btn" class="start-btn">START</button>
    <p id="home-note" class="home-note"></p>
  </div>

  <!-- 연습 화면: 화면 전체가 터치 영역 -->
  <div id="screen-practice" class="screen practice-screen" hidden>
    <div id="tap-area" class="tap-area" role="button" tabindex="0">
      <p id="status-text" class="status-text"></p>
      <p id="sentence-text" class="sentence-text"></p>
    </div>
    <div class="bottom-bar">
      <span id="progress-text" class="progress-text"></span>
      <button id="exit-btn" class="exit-btn">종료</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
