<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OPIc Trainer</title>
  <link rel="stylesheet" href="style.css" />

  <!-- PWA 설치(홈 화면 추가) + 웹 푸시(-> 아이폰 알림 -> 애플워치 미러링) 지원 -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OPIc" />
</head>
<body>
  <div class="split">
    <!-- 위 절반: 답변 말하기 -->
    <div id="answer-zone" class="zone answer-zone" role="button" tabindex="0">
      <p class="zone-label">답변 말하기</p>
      <button id="flip-btn" class="flip-btn" aria-label="화면 뒤집기">↻</button>
      <p id="sentence-text" class="sentence-text"></p>
      <p id="context-text" class="context-text"></p>
      <p id="answer-status" class="zone-status"></p>
      <p id="progress-text" class="progress-text"></p>
    </div>

    <!-- 아래 절반: 듣기 -->
    <div id="listen-zone" class="zone listen-zone" role="button" tabindex="0">
      <p class="zone-label">듣기</p>
      <p id="listen-status" class="zone-status">터치해서 질문 듣기</p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
